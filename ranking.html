<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TETRIX — Rankings</title>
<meta name="description" content="TETRIX top 20 high scores">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #232c5e;
  --bg-panel: #2a3466;
  --bg-panel-light: #37417f;
  --accent-cyan: #00f5ff;
  --accent-magenta: #ff2e97;
  --accent-yellow: #ffe135;
  --text-main: #eef2ff;
  --text-dim: #aab2dc;
  --border-soft: rgba(255, 255, 255, 0.14);
  --font-display: 'Press Start 2P', monospace;
  --font-mono: 'Space Mono', monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: radial-gradient(ellipse at top, #2a3466 0%, #1c2450 70%);
  color: var(--text-main);
  font-family: var(--font-mono);
  min-height: 100vh;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* CRT 스캔라인 오버레이 (신호 요소) */
.scanlines {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255, 255, 255, 0.025) 0px,
    rgba(255, 255, 255, 0.025) 1px,
    transparent 1px,
    transparent 3px
  );
  mix-blend-mode: overlay;
}

.hero {
  text-align: center;
  padding: 56px 20px 24px;
}

#logo-canvas {
  width: 100%;
  max-width: 640px;
  height: auto;
  image-rendering: pixelated;
}

.hero-tag {
  color: var(--text-dim);
  font-size: 13px;
  letter-spacing: 0.03em;
  margin-top: 4px;
}

main {
  max-width: 980px;
  margin: 0 auto;
  padding: 0 20px 60px;
}

.stage-frame {
  background: linear-gradient(180deg, #333d78, #1e2557);
  border: 3px solid #454f8f;
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 0 0 1px rgba(0, 245, 255, 0.06), 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 0 40px rgba(0, 245, 255, 0.03);
}

.stage-topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 6px 8px 14px;
}

.badge {
  font-family: var(--font-display);
  font-size: 10px;
  color: var(--accent-magenta);
  background: rgba(255, 46, 151, 0.12);
  border: 1px solid rgba(255, 46, 151, 0.4);
  padding: 6px 10px;
  border-radius: 4px;
  animation: blink 1.4s steps(2) infinite;
}
.badge.live {
  color: var(--accent-cyan);
  background: rgba(0, 245, 255, 0.12);
  border-color: rgba(0, 245, 255, 0.5);
}
@keyframes blink { 50% { opacity: 0.35; } }

.caption {
  color: var(--text-dim);
  font-size: 12px;
  flex: 1;
}

.ghost-btn {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 12px;
  color: var(--text-main);
  background: var(--bg-panel-light);
  border: 1px solid var(--border-soft);
  border-radius: 6px;
  padding: 9px 14px;
  cursor: pointer;
  transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
}
.ghost-btn:hover { border-color: var(--accent-cyan); background: #232c5e; }
.ghost-btn:active { transform: scale(0.97); }
.ghost-btn:focus-visible { outline: 2px solid var(--accent-cyan); outline-offset: 2px; }
.ghost-btn.full { width: 100%; margin: 4px 0 14px; }

.stage-body {
  display: flex;
  gap: 18px;
  align-items: flex-start;
  flex-wrap: wrap;
  justify-content: center;
}

.canvas-wrap {
  position: relative;
  border-radius: 8px;
  overflow: hidden;
  border: 2px solid #454f8f;
  box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6);
  line-height: 0;
  max-width: 100%;
}

#stage-canvas {
  display: block;
  image-rendering: pixelated;
  max-width: 100%;
  height: auto;
}

.stage-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(28, 36, 80, 0.8);
  font-family: var(--font-display);
}

.sidebar {
  width: 220px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.stat-box {
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.stat-row { display: flex; gap: 10px; }
.stat-row .stat-box.small { flex: 1; }

.stat-label {
  font-family: var(--font-display);
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 0.05em;
}
.stat-value {
  font-family: var(--font-display);
  font-size: 18px;
  color: var(--accent-yellow);
}
.stat-row .stat-value { font-size: 15px; color: var(--accent-cyan); }

#next-canvas { display: block; margin-top: 2px; }

.controls-guide {
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-radius: 8px;
  padding: 12px 14px;
}
.controls-guide h3 {
  font-family: var(--font-display);
  font-size: 10px;
  color: var(--text-dim);
  margin: 0 0 10px;
}
.controls-guide ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.controls-guide li { font-size: 12px; color: var(--text-main); display: flex; align-items: center; gap: 6px; }
kbd {
  font-family: var(--font-mono);
  font-size: 11px;
  background: #10143a;
  border: 1px solid #3a4380;
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 2px 6px;
  color: var(--accent-cyan);
}

.progress-track {
  margin-top: 14px;
  height: 6px;
  background: #10143a;
  border-radius: 999px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent-magenta), var(--accent-cyan));
  transition: width 0.1s linear;
}

.howto-section {
  margin-bottom: 28px;
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
  padding: 24px 26px;
}
.howto-section h2 {
  font-family: var(--font-display);
  font-size: 13px;
  color: var(--accent-cyan);
  margin: 0 0 12px;
}
.howto-section h2:not(:first-child) { margin-top: 22px; }
.howto-section p {
  font-size: 13px;
  line-height: 1.8;
  color: var(--text-dim);
  margin: 0 0 4px;
}
.howto-section strong { color: var(--text-main); }

.howto-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.howto-list li {
  font-size: 13px;
  line-height: 1.7;
  color: var(--text-dim);
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 6px;
}
.howto-list kbd {
  flex-shrink: 0;
}
.howto-list strong {
  color: var(--accent-yellow);
  margin-right: 2px;
}

.howto-note {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px dashed var(--border-soft);
  font-size: 12px;
}

/* ---------- 모바일 터치 컨트롤 ---------- */
.touch-controls {
  display: none;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  max-width: 340px;
  margin-top: 4px;
  user-select: none;
}
.touch-row { display: flex; gap: 10px; }
.touch-btn {
  flex: 1;
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 20px;
  color: var(--text-main);
  background: var(--bg-panel-light);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
  padding: 16px 0;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.touch-btn.wide { font-size: 13px; padding: 14px 4px; }
.touch-btn:active { background: #2c3768; border-color: var(--accent-cyan); }

@media (max-width: 720px), (pointer: coarse) {
  .touch-controls { display: flex; }
}

/* ---------- 모달 (이니셜 입력 / 순위표) ---------- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(20, 26, 58, 0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-backdrop[hidden] { display: none; }
.modal-box {
  width: 100%;
  max-width: 380px;
  background: linear-gradient(180deg, #333d78, #1e2557);
  border: 2px solid #454f8f;
  border-radius: 14px;
  padding: 24px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
}
.modal-box h2 {
  font-family: var(--font-display);
  font-size: 14px;
  color: var(--accent-yellow);
  margin: 0 0 14px;
  text-align: center;
}
.modal-box p { font-size: 12px; color: var(--text-dim); text-align: center; margin: 0 0 16px; }

.initials-input {
  display: block;
  width: 140px;
  margin: 0 auto 16px;
  font-family: var(--font-display);
  font-size: 28px;
  letter-spacing: 10px;
  text-align: center;
  text-transform: uppercase;
  color: var(--accent-cyan);
  background: #10143a;
  border: 2px solid #3a4380;
  border-radius: 8px;
  padding: 10px 6px 10px 16px;
}
.initials-input:focus { outline: none; border-color: var(--accent-cyan); }

.lb-table { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; max-height: 320px; overflow-y: auto; }
.lb-row {
  display: grid;
  grid-template-columns: 32px 50px 1fr 70px;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  background: var(--bg-panel);
  border-radius: 6px;
  font-size: 12px;
}
.lb-row--new { outline: 2px solid var(--accent-cyan); background: rgba(0, 245, 255, 0.08); }
.lb-rank { color: var(--text-dim); text-align: center; }
.lb-initials { font-family: var(--font-display); font-size: 11px; color: var(--accent-yellow); }
.lb-score { color: var(--text-main); font-weight: 700; text-align: right; }
.lb-date { color: var(--text-dim); font-size: 10px; text-align: right; }
.lb-empty { text-align: center; color: var(--text-dim); font-size: 12px; padding: 20px 0; }

.footer-note { font-size: 10px; margin-top: 6px; opacity: 0.7; }

.about-section {

  margin-top: 40px;
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
  padding: 22px 24px;
}
.about-section h2 {
  font-family: var(--font-display);
  font-size: 13px;
  color: var(--accent-cyan);
  margin-top: 0;
}
.about-section p { font-size: 13px; line-height: 1.8; color: var(--text-dim); }
.about-section strong { color: var(--text-main); }

footer {
  text-align: center;
  color: var(--text-dim);
  font-size: 11px;
  padding: 30px 20px 50px;
}

@media (max-width: 720px) {
  .stage-body { flex-direction: column; align-items: center; }
  .sidebar { width: 100%; max-width: 320px; }
}

/* ---------- 언어 전환 바 ---------- */
.lang-switch {
  position: sticky;
  top: 0;
  z-index: 500;
  display: flex;
  justify-content: center;
  gap: 6px;
  flex-wrap: wrap;
  padding: 10px;
  background: rgba(20, 26, 58, 0.85);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--border-soft);
}
.lang-btn {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--text-dim);
  background: transparent;
  border: 1px solid var(--border-soft);
  border-radius: 999px;
  padding: 6px 12px;
  cursor: pointer;
}
.lang-btn:hover { color: var(--text-main); border-color: var(--accent-cyan); }
.lang-btn.active {
  color: #0a0e27;
  background: var(--accent-cyan);
  border-color: var(--accent-cyan);
}

/* ---------- 링크를 버튼처럼 ---------- */
a.ghost-btn.link-btn {
  display: block;
  text-align: center;
  text-decoration: none;
}

/* ---------- 랭킹 페이지 ---------- */
.hero--small { padding: 40px 20px 10px; }
.text-logo {
  font-family: var(--font-display);
  font-size: 42px;
  text-align: center;
  margin: 0;
  background: linear-gradient(90deg, var(--accent-cyan), var(--accent-magenta), var(--accent-yellow));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.ranking-main { max-width: 720px; margin: 0 auto; padding: 0 20px 60px; }
.ranking-page {
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-radius: 12px;
  padding: 26px 28px;
}
.back-link {
  display: inline-block;
  width: auto;
  margin-bottom: 18px;
  text-decoration: none;
}
.ranking-page h2 {
  font-family: var(--font-display);
  font-size: 16px;
  color: var(--accent-yellow);
  margin: 0 0 10px;
}
.ranking-subtitle { font-size: 12px; color: var(--text-dim); margin: 0 0 20px; line-height: 1.6; }
.lb-header-row {
  display: grid;
  grid-template-columns: 32px 50px 1fr 70px;
  gap: 8px;
  padding: 0 10px 8px;
  font-size: 10px;
  color: var(--text-dim);
  font-family: var(--font-display);
  border-bottom: 1px solid var(--border-soft);
  margin-bottom: 8px;
}

</style>
</head>
<body>
<div class="scanlines" aria-hidden="true"></div>

<div class="lang-switch" id="lang-switch">
  <button class="lang-btn" data-lang="ko">한국어</button>
  <button class="lang-btn" data-lang="en">English</button>
  <button class="lang-btn" data-lang="ja">日本語</button>
  <button class="lang-btn" data-lang="zh">中文</button>
</div>

<header class="hero hero--small">
  <h1 class="text-logo">TETRIX</h1>
</header>

<main class="ranking-main">
  <section class="ranking-page">
    <a href="index.html" class="ghost-btn back-link" data-i18n="backToGame">← Back to Game</a>
    <h2 data-i18n="rankingPageTitle">🏆 Full Rankings (Top 20)</h2>
    <p class="ranking-subtitle" data-i18n="rankingSubtitle">This board only shows scores saved in this browser.</p>

    <div class="lb-header-row">
      <span data-i18n="colRank">Rank</span>
      <span data-i18n="colInitials">Initials</span>
      <span data-i18n="colScore">Score</span>
      <span data-i18n="colDate">Date</span>
    </div>
    <div id="ranking-table"></div>
  </section>
</main>

<footer>
  <p data-i18n="footerNote">High scores are saved in your own browser only — they're not shared with other visitors.</p>
</footer>

<script>

function getLang() {
  try {
    return localStorage.getItem(LANG_KEY) || "ko";
  } catch (e) {
    return "ko";
  }
}

function setLang(lang) {
  try {
    localStorage.setItem(LANG_KEY, lang);
  } catch (e) {
    /* ignore */
  }
}

function t(key) {
  const lang = getLang();
  return (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
}

// data-i18n 속성이 붙은 모든 요소의 텍스트를 현재 언어로 교체
function applyStaticTranslations() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    el.textContent = t(key);
  });
  document.documentElement.lang = getLang();
}

window.TetrixI18n = { I18N, getLang, setLang, t, applyStaticTranslations, LANG_KEY };


/* ---- js/leaderboard.js ---- */
/* =========================================================
   TETRIX - Leaderboard (Cloud + Local fallback)

   전 세계 방문자가 기록을 공유하는 진짜 글로벌 순위표를 쓰려면
   아래 FIREBASE_URL 에 본인의 Firebase Realtime Database 주소를
   넣으세요. (무료, 회원가입만 하면 됨 — README.md 참고)

   비워두면(기본값) 예전처럼 "이 브라우저에만" 저장되는 로컬
   모드로 자동 동작합니다 — 아무것도 깨지지 않아요.
   ========================================================= */

const FIREBASE_URL = ""; // 예: "https://tetrix-xxxxx-default-rtdb.asia-southeast1.firebasedatabase.app"

const LB_KEY = "tetrix_highscores_v1";
const MAX_ENTRIES = 20;
const cloudEnabled = () => !!FIREBASE_URL;

/* ---------- 로컬(브라우저 전용) 저장 — 폴백/기본 모드 ---------- */
function safeGet(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return (window.__tetrixMemoryStore && window.__tetrixMemoryStore[key]) || null;
  }
}
function safeSet(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    window.__tetrixMemoryStore = window.__tetrixMemoryStore || {};
    window.__tetrixMemoryStore[key] = value;
  }
}
function getLocalScores() {
  return safeGet(LB_KEY) || [];
}
function addLocalScore(entry) {
  const scores = getLocalScores();
  scores.push(entry);
  scores.sort((a, b) => b.score - a.score);
  const trimmed = scores.slice(0, MAX_ENTRIES);
  safeSet(LB_KEY, trimmed);
  return trimmed;
}

/* ---------- 클라우드(Firebase Realtime Database REST API) ---------- */
async function getCloudScores() {
  const res = await fetch(`${FIREBASE_URL}/scores.json?orderBy="score"&limitToLast=${MAX_ENTRIES}`);
  if (!res.ok) throw new Error("cloud fetch failed: " + res.status);
  const data = await res.json();
  if (!data) return [];
  const list = Object.values(data);
  list.sort((a, b) => b.score - a.score);
  return list;
}
async function addCloudScore(entry) {
  const res = await fetch(`${FIREBASE_URL}/scores.json`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(entry)
  });
  if (!res.ok) throw new Error("cloud write failed: " + res.status);
  return getCloudScores();
}

/* ---------- 공개 API (전부 async — 클라우드/로컬 모드 모두 동일하게 사용) ---------- */
async function getScores() {
  if (!cloudEnabled()) return getLocalScores();
  try {
    return await getCloudScores();
  } catch (e) {
    console.warn("[TETRIX] Cloud leaderboard unavailable, falling back to local.", e);
    return getLocalScores();
  }
}

async function qualifies(score) {
  if (!score || score <= 0) return false;
  const scores = await getScores();
  if (scores.length < MAX_ENTRIES) return true;
  return score > scores[scores.length - 1].score;
}

async function addScore(initials, score) {
  const clean = (initials || "").replace(/[^a-zA-Z0-9]/g, "").slice(0, 3).toUpperCase() || "AAA";
  const entry = { initials: clean, score, date: new Date().toISOString().slice(0, 10) };

  if (!cloudEnabled()) return addLocalScore(entry);
  try {
    return await addCloudScore(entry);
  } catch (e) {
    console.warn("[TETRIX] Cloud leaderboard unavailable, saving locally instead.", e);
    return addLocalScore(entry);
  }
}

function renderRows(scores, highlightIndex = -1) {
  if (scores.length === 0) {
    return `<p class="lb-empty">No scores yet — be the first!</p>`;
  }
  return `<div class="lb-table">${scores
    .map((entry, i) => {
      const rank = i + 1;
      const medal = rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : rank;
      const hl = i === highlightIndex ? " lb-row--new" : "";
      return `<div class="lb-row${hl}">
        <span class="lb-rank">${medal}</span>
        <span class="lb-initials">${entry.initials}</span>
        <span class="lb-score">${entry.score.toLocaleString()}</span>
        <span class="lb-date">${entry.date}</span>
      </div>`;
    })
    .join("")}</div>`;
}

window.TetrixLeaderboard = { getScores, qualifies, addScore, renderRows, MAX_ENTRIES, cloudEnabled };

</script>
<script>
(function () {
  const { getScores, cloudEnabled } = window.TetrixLeaderboard;
  const { applyStaticTranslations, getLang, setLang, t } = window.TetrixI18n;

  async function renderPage() {
    applyStaticTranslations();

    const subtitleEl = document.querySelector(".ranking-subtitle");
    const footerNoteEl = document.querySelector(".footer-note, footer p");
    if (cloudEnabled()) {
      subtitleEl.textContent = t("rankingSubtitleGlobal");
      if (footerNoteEl) footerNoteEl.textContent = t("footerNoteGlobal");
    }

    document.getElementById("ranking-table").innerHTML = `<p class="lb-empty">${t("loadingLabel")}</p>`;
    const scores = await getScores();
    const html = scores.length
      ? window.TetrixLeaderboard.renderRows(scores)
      : `<p class="lb-empty">${t("emptyScores")}</p>`;
    document.getElementById("ranking-table").innerHTML = html;

    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.lang === getLang());
    });
  }

  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      setLang(btn.dataset.lang);
      renderPage();
    });
  });

  renderPage();
})();
</script>
